[project]
name = "iam-lib"
authors = [
  {name = "Mark Servilla", email = "mark.servilla@gmail.com"}
]
description = "Add a short description here"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.12,<3.14"
dynamic = ["version"]
dependencies = [
  "daiquiri>=3.4.0,<4",
  "requests>=2.34.2,<3",
  "pyjwt>=2.13.0,<3",
  "cryptography>=49.0.0,<50",
]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.version]
path = "src/iam_lib/VERSION.txt"
pattern = "(?P<version>\\d+\\.\\d+\\.\\d+)"

[tool.hatch.build.targets.sdist]
only-include = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
addopts = "--capture=no --verbose"
pythonpath = ["src"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64", "win-64", "osx-64", "osx-arm64"]

[tool.pixi.tasks]
test = "pytest"
lint = "ruff check ."

[tool.pixi.dependencies]
python = ">=3.12,<3.14"

[tool.pixi.pypi-dependencies]
iam-lib = { path = ".", editable = true }

[tool.pixi.feature.test.dependencies]
pytest = ">=9.1.1,<10"
pytest-mock = ">=3.15.1,<4"

[tool.pixi.feature.lint.dependencies]
ruff = ">=0.15.21,<0.16"

[tool.pixi.environments]
default = { features = ["test", "lint"], solve-group = "default" }
